<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather Wallpaper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background">
        <!-- Video container -->
        <video id="weather-video" autoplay muted loop></video>
    </div>
    <div id="info">
        <div id="time"></div>
        <div id="weather"></div>
        <div id="temperature"></div>
        <div id="image-info"></div>
        <div id="media-info"></div>
    </div>
    <div id="testing">
        <label>
            Override Time (HH:MM):
            <input type="text" id="override-time" placeholder="e.g., 14:30">
            <input type="checkbox" id="override-time-checkbox"> Enable
        </label>
        <br>
        <label>
            Override Weather (e.g., rain, snow, clear):
            <input type="text" id="override-weather" placeholder="e.g., rain">
            <input type="checkbox" id="override-weather-checkbox"> Enable
        </label>
        <br>
        <label>
            Override Temperature (°C):
            <input type="text" id="override-temperature" placeholder="e.g., 25">
        </label>
    </div>
    <script src="script.js"></script>
</body>
</html>
