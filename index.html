<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather Wallpaper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background">
        <!-- Video container -->
        <video id="weather-video" autoplay muted loop></video>

        <!-- Audio container -->
        <audio id="weather-audio" loop></audio>
    </div>
    <div id="info"></div>
    <script src="script.js"></script>
</body>
</html>
